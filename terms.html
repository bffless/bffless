<!doctype html>
<html lang="en">
  <head>
    <!-- Analytics gate -->
    <script>
      // Only load analytics on the canonical public hostnames. BFFless preview
      // deploys (<sha>-<app>-<hash>.bffless.dev) and localhost were firing
      // page_view and conversion events into the production property.
      //
      // A/B traffic splitting serves every arm from the apex and signals the arm
      // via the __bffless_variant cookie, so gating on hostname does NOT affect
      // the split.
      var ANALYTICS_HOSTS = [
        'bffless.dev', 'www.bffless.dev',
        'bffless.app', 'www.bffless.app',
        'bffless.com', 'www.bffless.com'
      ];
      window.__ANALYTICS_ENABLED =
        ANALYTICS_HOSTS.indexOf(window.location.hostname) !== -1;

      // A/B test arm. BFFless traffic splitting sets __bffless_variant to the alias
      // name (landing-production / landing-variant-a / landing-variant-b) on the
      // HTML response; outside a split there is no cookie and the arm is 'unassigned'.
      function getVariantCookie() {
        var match = document.cookie.match(/(?:^|; )__bffless_variant=([^;]*)/);
        return match ? decodeURIComponent(match[1]) : null;
      }
    </script>

    <!-- Google tag (gtag.js) -->
    <script>
      // gtag() is always defined so callers never have to null-check it. When
      // analytics is disabled the calls just queue in dataLayer and go nowhere.
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      if (window.__ANALYTICS_ENABLED) {
      var gaScript = document.createElement('script');
      gaScript.async = true;
      gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-5DLRCRSLFS';
      document.head.appendChild(gaScript);

      var landingVariant = getVariantCookie() || 'unassigned';
      gtag('js', new Date());
      // `variant` rides on every event (page_view included) and is also a user
      // property, so GA4 can report visitors, sessions and key events per arm once
      // custom dimensions named `variant` (event- and user-scoped) exist in Admin.
      gtag('set', 'user_properties', { variant: landingVariant });
      gtag('config', 'G-5DLRCRSLFS', { variant: landingVariant });
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="canonical" href="https://bffless.dev/terms.html" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="BFFless Terms of Service - Read our terms and conditions for using the BFFless static asset hosting platform."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BFFless" />
    <meta property="og:url" content="https://bffless.dev/terms.html" />
    <meta property="og:title" content="Terms of Service — BFFless" />
    <meta
      property="og:description"
      content="BFFless Terms of Service - Terms and conditions for the static asset hosting platform."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Terms of Service — BFFless" />
    <meta name="twitter:description" content="BFFless Terms of Service - Terms and conditions." />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/terms.tsx"></script>
  </body>
</html>
