<!doctype html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5DLRCRSLFS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      // A/B test arm. BFFless traffic splitting sets __bffless_variant to the alias
      // name (landing-production / landing-variant-a / landing-variant-b) on the
      // HTML response; outside a split there is no cookie and the arm is 'unassigned'.
      function getVariantCookie() {
        var match = document.cookie.match(/(?:^|; )__bffless_variant=([^;]*)/);
        return match ? decodeURIComponent(match[1]) : null;
      }
      var landingVariant = getVariantCookie() || 'unassigned';
      gtag('js', new Date());
      // `variant` rides on every event (page_view included) and is also a user
      // property, so GA4 can report visitors, sessions and key events per arm once
      // custom dimensions named `variant` (event- and user-scoped) exist in Admin.
      gtag('set', 'user_properties', { variant: landingVariant });
      gtag('config', 'G-5DLRCRSLFS', { variant: landingVariant });
    </script>
