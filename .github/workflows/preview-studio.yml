name: Preview studio

# Credentials: this repo already has vars.LANDING_ASSET_HOST_URL /
# secrets.LANDING_ASSET_HOST_KEY for the landing site. These workflows keep the
# names @bffless/workflow generated (vars.BFFLESS_URL / secrets.BFFLESS_API_KEY)
# ON PURPOSE rather than reusing the landing pair: the studio implementation
# publishes to a different surface (a workflow alias + its rule set under the
# `workflow` harness), so it deserves a key whose blast radius can be scoped and
# rotated independently of the landing site's. Both are NEW and must be set
# before the first deploy — see the PR description's maintainer TODO.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'studio/**'
      - '.github/workflows/preview-studio.yml'

permissions:
  contents: read

concurrency:
  # Flow-style `{ group: preview-${{ ... }} }` is genuinely ambiguous YAML (a
  # `{{` inside a flow mapping) — block style, mirroring workflow-implementations.
  group: preview-studio-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          # studio/ is a STANDALONE package, not a workspace member — it carries
          # its own lockfile so that a studio dependency bump never touches the
          # root pnpm-lock.yaml the landing site's CI keys off. See the comment
          # in .github/workflows/build.yml.
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: studio
      # The bundle must say which implementation it is (needs @bffless/workflow-lint >= 1.0.1).
      - run: "pnpm run build --impl studio-pr-${{ github.event.number }} --name 'Studio (PR #${{ github.event.number }})'"
        working-directory: studio
      # After build, not before: several suites are `it.skipIf(!existsSync(dist/...))`
      # assertions about the built bundle, and silently skip if dist/ is absent.
      - run: pnpm run test:run
        working-directory: studio
      - uses: bffless/publish-workflow@v1
        with:
          alias: studio-pr-${{ github.event.number }}
          name: "Studio (PR #${{ github.event.number }})"
          description: 'studio — a BFFless Workflow implementation, created with @bffless/workflow init.'
          repository: bffless/bffless.app
          harness-alias: workflow
          path: studio/dist
          workflows: studio/.bffless/workflows
          rules: studio/.bffless/proxy-rules/studio
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
      - name: Assert the published bundle's impl matches the alias
        env:
          EXPECTED_IMPL: studio-pr-${{ github.event.number }}
        run: |
          node -e "
            const fs = require('node:fs');
            const idx = JSON.parse(fs.readFileSync('studio/dist/.bffless/workflows/index.json', 'utf8'));
            const expected = process.env.EXPECTED_IMPL;
            if (idx.impl !== expected) {
              console.error('::error::published bundle impl ' + JSON.stringify(idx.impl) + ' != alias ' + JSON.stringify(expected));
              process.exit(1);
            }
          "

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bffless/publish-workflow@v1
        with:
          mode: teardown
          alias: studio-pr-${{ github.event.number }}
          repository: bffless/bffless.app
          harness-alias: workflow
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
