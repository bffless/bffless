name: Preview studio

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'studio/**'
      - '.github/workflows/preview-studio.yml'

concurrency:
  # Flow-style `{ group: preview-${{ ... }} }` is genuinely ambiguous YAML (a
  # `{{` inside a flow mapping) — block style, mirroring workflow-implementations.
  group: preview-studio-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The bundle must say which implementation it is (needs @bffless/workflow-lint >= 1.0.1).
      - run: "pnpm --filter ./studio run build --impl studio-pr-${{ github.event.number }} --name 'Studio (PR #${{ github.event.number }})'"
      - uses: bffless/publish-workflow@v1
        with:
          alias: studio-pr-${{ github.event.number }}
          name: "Studio (PR #${{ github.event.number }})"
          description: 'studio — a BFFless Workflow implementation, created with @bffless/workflow init.'
          repository: bffless/bffless.app
          harness-alias: workflow
          path: studio/dist
          workflows: studio/.bffless/workflows
          rules: studio/.bffless/proxy-rules/studio
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
      - name: Assert the published bundle's impl matches the alias
        env:
          EXPECTED_IMPL: studio-pr-${{ github.event.number }}
        run: |
          node -e "
            const fs = require('node:fs');
            const idx = JSON.parse(fs.readFileSync('studio/dist/.bffless/workflows/index.json', 'utf8'));
            const expected = process.env.EXPECTED_IMPL;
            if (idx.impl !== expected) {
              console.error('::error::published bundle impl ' + JSON.stringify(idx.impl) + ' != alias ' + JSON.stringify(expected));
              process.exit(1);
            }
          "

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bffless/publish-workflow@v1
        with:
          mode: teardown
          alias: studio-pr-${{ github.event.number }}
          repository: bffless/bffless.app
          harness-alias: workflow
          api-url: ${{ vars.BFFLESS_URL }}
          api-key: ${{ secrets.BFFLESS_API_KEY }}
